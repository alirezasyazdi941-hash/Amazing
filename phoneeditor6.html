<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NN Studio">
<meta name="theme-color" content="#07070b">
<title>NONONICK Studio</title>
<style>
/* =========================================================
   STYLES
   ========================================================= */
:root{
  --bg:#07070b; --bg2:#0d0d14; --panel:#12121b; --panel2:#181824;
  --line:#232334; --line2:#2e2e44;
  --text:#e9e9f2; --dim:#8b8ba6; --dim2:#5f5f78;
  --accent:#3b82f6; --accent2:#8b5cf6; --neon:#22d3ee;
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
  --tabh:56px; --toph:52px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#f4f4f8; --bg2:#ffffff; --panel:#ffffff; --panel2:#f0f0f5;
  --line:#e0e0ea; --line2:#d0d0dd; --text:#12121b; --dim:#6b6b85; --dim2:#9a9ab0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  overflow:hidden;position:fixed;inset:0;
}
button{font-family:inherit;color:inherit;background:none;border:0;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{
  height:calc(var(--toph) + var(--sat));padding-top:var(--sat);
  display:flex;align-items:center;gap:8px;
  padding-left:calc(8px + var(--sal));padding-right:calc(8px + var(--sar));
  background:rgba(10,10,16,.72);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);z-index:40;flex:none;
}
[data-theme="light"] #topbar{background:rgba(255,255,255,.8)}
.tb-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--panel);border:1px solid var(--line)}
.tb-btn:active{background:var(--panel2)}
#tb-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;overflow:hidden}
#tb-project{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tb-sub{font-size:10px;color:var(--dim2);letter-spacing:.08em;text-transform:uppercase}

#views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.active{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
#file-scroll{padding:8px 0 80px}
#project-scroll{padding-bottom:80px}

#tabbar{
  flex:none;height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);
  display:flex;background:rgba(10,10,16,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);z-index:40;
}
[data-theme="light"] #tabbar{background:rgba(255,255,255,.86)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim2);font-size:9.5px;letter-spacing:.03em;padding-top:6px}
.tab i{font-size:19px;font-style:normal;line-height:1}
.tab.active{color:var(--accent)}
.tab.active i{filter:drop-shadow(0 0 8px var(--accent))}

.hero{position:relative;padding:26px 18px 18px;overflow:hidden}
.hero-glow{position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:320px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,246,.35),rgba(139,92,246,.18) 45%,transparent 70%);filter:blur(30px);pointer-events:none}
.hero h1{font-size:28px;letter-spacing:-.5px;position:relative}
.hero h1 span{background:linear-gradient(90deg,var(--neon),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:5px}
.hero p{color:var(--dim);font-size:12px;margin:6px 0 16px;letter-spacing:.06em;text-transform:uppercase}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:500}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 6px 20px -6px var(--accent)}
.link{color:var(--accent);font-size:12px}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.section-head h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}

.card-list{padding:0 12px;display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.pcard-main{flex:1;min-width:0}
.pcard h3{font-size:15px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .meta{font-size:11px;color:var(--dim2);display:flex;gap:8px;flex-wrap:wrap}
.pcard .meta b{color:var(--dim);font-weight:500}
.pcard-actions{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
.empty{text-align:center;color:var(--dim2);padding:36px 20px;font-size:13px}

.toolbar{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line);flex:none;background:var(--bg2)}
.toolbar::-webkit-scrollbar{display:none}
.tb2{flex:none;padding:7px 11px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12px;white-space:nowrap;color:var(--dim)}
.tb2.active,.tb2:active{color:var(--text);border-color:var(--accent);background:rgba(59,130,246,.12)}

.tree{padding:4px 8px}
.tnode{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;font-size:13.5px}
.tnode:active{background:var(--panel2)}
.tnode.active{background:rgba(59,130,246,.14);color:var(--accent)}
.tnode .ico{width:18px;text-align:center;font-size:14px;flex:none}
.tnode .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .sz{font-size:10px;color:var(--dim2);flex:none}
.tnode.folder .nm{font-weight:600}
.tchildren{margin-left:16px;border-left:1px solid var(--line);padding-left:2px}

.tabstrip{display:flex;gap:1px;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;min-height:36px}
.tabstrip::-webkit-scrollbar{display:none}
.etab{flex:none;display:flex;align-items:center;gap:6px;padding:9px 12px;font-size:12px;color:var(--dim);border-right:1px solid var(--line);max-width:170px}
.etab.active{color:var(--text);background:var(--panel);box-shadow:inset 0 -2px 0 var(--accent)}
.etab .x{font-size:14px;color:var(--dim2);padding:0 2px}
.etab .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.editor-modes{display:flex;gap:4px;padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
.mode{padding:5px 12px;border-radius:8px;font-size:12px;color:var(--dim2);border:1px solid transparent}
.mode.active{background:var(--panel);color:var(--text);border-color:var(--line2)}

.editor-body{flex:1;display:flex;overflow:hidden;position:relative}
.code-pane{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#view-editor[data-mode="visual"] .code-pane{display:none}
#view-editor[data-mode="visual"] .split-pane{flex:1;display:flex !important}
#view-editor[data-mode="code"] .split-pane{display:none}
#view-editor[data-mode="split"] .code-pane{flex:1}
#view-editor[data-mode="split"] .split-pane{flex:1;display:flex;border-left:1px solid var(--line)}
.split-pane{display:none;flex-direction:column;min-width:0;overflow:hidden;background:#000}

.ce{flex:1;display:flex;overflow:hidden;position:relative;background:var(--bg)}
.ce-gutter{flex:none;width:42px;overflow:hidden;padding:10px 6px 10px 0;text-align:right;
  font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--dim2);
  background:var(--bg2);border-right:1px solid var(--line);user-select:none;-webkit-user-select:none}
.ce-wrap{flex:1;position:relative;overflow:hidden}
.ce-hl{position:absolute;top:0;left:0;margin:0;padding:10px 12px;
  font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre;tab-size:2;
  pointer-events:none;min-width:100%;will-change:transform}
.ce-ta{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:10px 12px;
  font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre;tab-size:2;
  background:transparent;color:transparent;caret-color:var(--neon);
  border:0;outline:0;resize:none;overflow:auto;-webkit-overflow-scrolling:touch}
.ce-ta::selection{background:rgba(59,130,246,.35)}
.tk-com{color:#5a5a75;font-style:italic}
.tk-tag{color:#f472b6}
.tk-att{color:#fbbf24}
.tk-str{color:#34d399}
.tk-key{color:#a78bfa}
.tk-num{color:#22d3ee}
.tk-prop{color:#60a5fa}
.tk-punc{color:#6b6b88}
.tk-sel{color:#f472b6}
.tk-bool{color:#f59e0b}

.code-toolbar{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--sab))}
.ct-row{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.ct-row::-webkit-scrollbar{display:none}
.ct-row button{flex:none;min-width:34px;height:32px;padding:0 9px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--dim)}
.ct-row button:active{background:var(--accent);color:#fff}
.ct-actions button{font-family:var(--sans);font-size:11px}

.preview-stage{flex:1;overflow:auto;background:#0a0a10;display:flex;justify-content:center;align-items:flex-start;padding:12px;-webkit-overflow-scrolling:touch;min-height:0}
.preview-frame-wrap{flex:1 1 auto;display:flex;justify-content:center;align-items:stretch;overflow:auto;background:transparent;min-height:0;width:100%;max-width:100%}
.preview-frame-wrap iframe{background:#fff;border:0;display:block;width:100%;height:100%;min-height:calc(100vh - 220px);border-radius:14px;box-shadow:0 12px 40px -12px rgba(0,0,0,.9);margin:0 auto;flex:none}
.preview-stage .preview-frame-wrap{align-items:flex-start;padding-bottom:16px}
.preview-frame-wrap iframe.dev-mobile{width:390px !important;max-width:100% !important;height:844px !important;max-height:calc(100vh - 200px) !important;min-height:0 !important;border-radius:28px;box-shadow:0 0 0 10px #1a1a24,0 0 0 12px #2e2e44,0 20px 50px -12px rgba(0,0,0,.85)}
.preview-frame-wrap iframe.dev-tablet{width:768px !important;max-width:100% !important;height:1024px !important;max-height:calc(100vh - 200px) !important;min-height:0 !important;border-radius:18px;box-shadow:0 0 0 8px #1a1a24,0 0 0 10px #2e2e44,0 20px 50px -12px rgba(0,0,0,.85)}
.preview-frame-wrap iframe.dev-desktop{width:1280px !important;max-width:100% !important;height:800px !important;max-height:calc(100vh - 200px) !important;min-height:0 !important;border-radius:10px;box-shadow:0 0 0 6px #1a1a24,0 0 0 8px #2e2e44,0 20px 50px -12px rgba(0,0,0,.85)}
.preview-stage.device-mode .preview-frame-wrap{flex:none;width:max-content;max-width:none;min-width:100%;justify-content:center}
.preview-frame-wrap.select-mode iframe{outline:2px solid var(--accent);outline-offset:3px}
.visual-toolbar{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:8px 10px calc(8px + var(--sab));display:none;overflow:hidden;z-index:30}
.visual-toolbar.on{display:block}
.vt-scroll{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;align-items:center;min-height:40px}
.vt-scroll::-webkit-scrollbar{display:none}
.vt-scroll button{flex:none;padding:9px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--text);font-weight:500;white-space:nowrap}
.vt-scroll button:active{background:var(--accent);color:#fff;border-color:transparent}
.vt-tag{flex:none;display:flex;align-items:center;padding:6px 12px;font-family:var(--mono);font-size:11px;color:var(--neon);background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);border-radius:8px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt-hint{flex:1;font-size:12px;color:var(--dim);padding:0 4px;min-width:100px}
.preview-entry-badge{flex:none;padding:5px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:10px;color:var(--dim);font-family:var(--mono);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb2.active{color:var(--text);border-color:var(--accent);background:rgba(59,130,246,.12)}

#sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
#sheet-backdrop.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--panel);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line2);
  transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:82vh;display:flex;flex-direction:column;padding-bottom:var(--sab)}
#sheet.on{transform:translateY(0)}
.sheet-grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:15px}
#sheet-close{width:30px;height:30px;border-radius:50%;background:var(--panel2);color:var(--dim);font-size:14px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px}

#drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .22s;z-index:70}
#drawer-backdrop.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:82vw;z-index:71;background:var(--panel);
  border-right:1px solid var(--line2);transform:translateX(-102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  padding:calc(16px + var(--sat)) 0 calc(16px + var(--sab));overflow-y:auto}
#drawer.on{transform:translateX(0)}
.dr-item{display:flex;align-items:center;gap:12px;padding:12px 20px;font-size:14.5px;color:var(--text)}
.dr-item:active{background:var(--panel2)}
.dr-item .i{width:22px;text-align:center;font-size:16px}
.dr-sep{height:1px;background:var(--line);margin:8px 16px}
.dr-title{padding:14px 20px 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}

#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translate(-50%,20px);
  background:rgba(24,24,36,.96);border:1px solid var(--line2);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;
  transition:all .22s;backdrop-filter:blur(10px);max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 10px;
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:22px}
.tile span{font-size:12px;color:var(--dim);font-weight:500}
.tile:active{background:var(--panel2);transform:scale(.98)}

.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin-bottom:6px}
.field input[type=text],.field input[type=password],.field input[type=number],.field select,.field textarea{
  width:100%;padding:11px 12px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);
  font-size:14px;outline:0}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:90px;font-family:var(--mono);font-size:13px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
.prop-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.prop-row label{width:88px;flex:none;font-size:12px;color:var(--dim)}
.prop-row input,.prop-row select{flex:1;padding:8px 10px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);font-size:13px;outline:0}
.prop-row input[type=color]{padding:2px;height:34px}

.diag{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);margin-bottom:7px;font-size:12.5px;align-items:flex-start}
.diag .d-ico{flex:none;width:16px;text-align:center}
.diag.error .d-ico{color:var(--err)}
.diag.warn .d-ico{color:var(--warn)}
.diag.info .d-ico{color:var(--accent)}
.diag .d-txt{flex:1;word-break:break-word}
.diag .d-file{color:var(--dim2);font-family:var(--mono);font-size:11px}

.diff{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.diff-h{padding:7px 10px;background:var(--panel2);font-size:11px;color:var(--dim);font-family:var(--sans);border-bottom:1px solid var(--line)}
.diff-line{padding:2px 10px;white-space:pre-wrap;word-break:break-all;line-height:1.5}
.diff-line.add{background:rgba(34,197,94,.12);color:#86efac}
.diff-line.del{background:rgba(239,68,68,.12);color:#fca5a5}
.diff-line.ctx{color:var(--dim2)}

.dnode{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;font-family:var(--mono);font-size:12px}
.dnode:active{background:var(--panel2)}
.dnode.sel{background:rgba(59,130,246,.18);color:var(--accent)}
.dnode .dt{color:#f472b6}
.dnode .di{color:#fbbf24;font-size:10.5px}
.dchildren{margin-left:12px;border-left:1px solid var(--line);padding-left:2px}

.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.acard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;position:relative}
.acard img{width:100%;height:100%;object-fit:cover}
.acard .an{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.72);color:#fff;font-size:9.5px;
  padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.spinner{width:22px;height:22px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:11.5px;color:var(--dim2);line-height:1.5;margin:8px 0}
.badge{display:inline-block;font-size:9.5px;padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);letter-spacing:.04em}
.badge.exec{color:var(--ok);border-color:rgba(34,197,94,.35)}
.badge.edit{color:var(--warn);border-color:rgba(245,158,11,.35)}
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <button class="tb-btn" id="btn-menu" aria-label="Menu">☰</button>
    <div id="tb-title">
      <span id="tb-project">No Project</span>
      <span id="tb-sub">NONONICK Studio</span>
    </div>
    <button class="tb-btn" id="btn-command" aria-label="Commands">⌘</button>
  </header>

  <main id="views">
    <section class="view" id="view-project">
      <div class="scroll" id="project-scroll">
        <div class="hero">
          <div class="hero-glow"></div>
          <h1>NONONICK<span>Studio</span></h1>
          <p>Import · Edit · Preview · Ship</p>
          <div class="hero-actions">
            <button class="btn primary" id="btn-new-project">New Project</button>
            <button class="btn" id="btn-import-zip">Import ZIP</button>
            <button class="btn" id="btn-import-files">Open Files</button>
          </div>

function h(tag, attrs = {}, ...kids) {

}
function formatBraces(code, indentSize) {
  const lines = code.replace(/\r\n/g, '\n').split('\n');
  const out = []; let depth = 0;
  for (let raw of lines) {
    const line = raw.trim();
    if (!line) { out.push(''); continue; }
    if (/^[}\])]/.test(line)) depth = Math.max(0, depth - 1);
    out.push(' '.repeat(depth * indentSize) + line);
    const opens = (line.match(/[{\[(]/g) || []).length;
    const closes = (line.match(/[}\])]/g) || []).length;
    depth += opens - closes;
    if (depth < 0) depth = 0;
  }
  return out.join('\n');
}
const VOID_TAGS = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
function formatMarkup(code) {
  let s = code.replace(/\r\n/g, '\n').replace(/>\s+</g, '><');
  const tokens = s.split(/(<[^>]+>)/).filter(t => t !== '');
  const out = []; let depth = 0;

      const name = new TextDecoder('utf-8').decode(buf.subarray(p + 46, p + 46 + nameLen));
      if (method !== 0 && method !== 8) { needFallback = true; break; }
      if (compSize === 0xFFFFFFFF || uncompSize === 0xFFFFFFFF) { needFallback = true; break; }
      entries.push({ name, method, compSize, localOffset });
      p += 46 + nameLen + extraLen + commentLen;
    }
    if (needFallback) return readZipWithJSZip(file);
    const out = [];
    for (const e of entries) {
      if (e.name.endsWith('/')) continue;
      if (!isSafePath(e.name)) continue;
      const lo = e.localOffset;
      if (dv.getUint32(lo, true) !== 0x04034b50) continue;
      const lNameLen = dv.getUint16(lo + 26, true);
      const lExtraLen = dv.getUint16(lo + 28, true);
      const dataStart = lo + 30 + lNameLen + lExtraLen;
      const raw = buf.subarray(dataStart, dataStart + e.compSize);
      let data;
      if (e.method === 0) data = new Uint8Array(raw);
      else { const inf = await inflateRaw(raw); if (!inf) return readZipWithJSZip(file); data = inf; }
      out.push({ path: e.name, data });
    }
    return out;
  }

  async function readZipWithJSZip(file) {
    const JSZip = await loadJSZip();
    const zip = await JSZip.loadAsync(file);
    const out = [];
    for (const name of Object.keys(zip.files)) {
      const f = zip.files[name];
      if (f.dir) continue;
      if (!isSafePath(name)) continue;
      out.push({ path: name, data: await f.async('uint8array') });
    }
    return out;
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  }

  return { createZip, readZip, isSafePath, downloadBlob };
})();

const MAX_INLINE_ASSET = 4 * 1024 * 1024;

async function textOfFile(file) {
  if (file.content instanceof Blob) return await file.content.text();
  return String(file.content ?? '');
}

function base64FromBytes(u8) {
  let bin = ''; const chunk = 0x8000;
  for (let i = 0; i < u8.length; i += chunk) {
    bin += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
  }
  return btoa(bin);
}

async function assetToDataURL(file) {
  try {
    let blob = file.content;
    if (!(blob instanceof Blob)) blob = new Blob([String(file.content)], { type: mimeOf(file.path) });
    if (blob.size > MAX_INLINE_ASSET) return null;
    const buf = await blob.arrayBuffer();
    return `data:${file.mime || mimeOf(file.path)};base64,${base64FromBytes(new Uint8Array(buf))}`;
  } catch { return null; }
}

async function rewriteCssUrls(css, base, fileMap, warnings) {
  if (!css || !/url\(/i.test(css)) return css;
  const re = /url\(\s*(['"]?)([^'")]+)\1\s*\)/gi;
  const matches = []; let m;
  while ((m = re.exec(css))) matches.push({ full: m[0], url: m[2] });
  for (const match of matches) {
    const u = match.url.trim();
    if (/^(data:|https?:|\/\/|#)/i.test(u)) continue;
    const p = resolvePath(base, u);
    const f = fileMap.get(p);
    if (!f) { warnings.push(`Missing CSS asset: ${u}`); continue; }
    const d = await assetToDataURL(f);
    if (!d) { warnings.push(`Asset too large to inline: ${u}`); continue; }
    css = css.split(match.full).join(`url("${d}")`);
  }
  return css;
}

function findEntry(fileMap) {
  for (const c of ['index.html','Index.html','index.htm','main.html','home.html']) {
    if (fileMap.has(c)) return fileMap.get(c);
  }
  for (const f of fileMap.values()) if (/\.html?$/i.test(f.path)) return f;
  return null;
}
function findEntryPath(files) {
  const paths = files.map(f => f.path);
  for (const c of ['index.html','Index.html','index.htm','main.html','home.html']) if (paths.includes(c)) return c;
  const any = paths.find(p => /\.html?$/i.test(p));
  return any || null;
}

async function buildBundle(files, entryPath, opts = {}) {
  const fileMap = new Map(files.map(f => [f.path, f]));
  const entryFile = fileMap.get(entryPath) || findEntry(fileMap);
  if (!entryFile) throw new Error('No HTML entry file found');

  const base = dirname(entryFile.path);
  const html = await textOfFile(entryFile);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const warnings = [];

  // stylesheets
  for (const link of Array.from(doc.querySelectorAll('link[rel~="stylesheet"][href], link[rel="stylesheet"][href]'))) {
    const href = link.getAttribute('href');
    const p = resolvePath(base, href);
    const f = fileMap.get(p);
    if (!f) { if (!/^https?:|^\/\//i.test(href)) warnings.push(`Missing stylesheet: ${href}`); continue; }
    const css = await textOfFile(f);
    const rw = await rewriteCssUrls(css, dirname(p), fileMap, warnings);
    const style = doc.createElement('style');
    style.setAttribute('data-src', p);
    style.textContent = rw;
    link.replaceWith(style);
  }

  // Build blob URL map for ALL local JS so ES module imports resolve
  const jsBlobUrls = new Map();
  const jsTexts = new Map();
  for (const [fp, ff] of fileMap) {
    if (!/\.(m?js|cjs)$/i.test(fp) && !/javascript|ecmascript/i.test(ff.mime || '')) continue;
    try {
      const txt = await textOfFile(ff);
      jsTexts.set(fp, txt);
    } catch {}
  }
  // rewrite relative imports inside each JS file to blob: URLs
  function rewriteImports(code, filePath) {
    const dir = dirname(filePath);
    return code.replace(
      /\b(import|export)\s+([^;]*?\s+from\s+)?["']([^"']+)["']/g,
      (full, kw, mid, spec) => {
        if (/^(https?:|data:|blob:|\/\/)/i.test(spec)) return full;
        const resolved = resolvePath(dir, spec);
        // try exact, then with .js / .mjs / /index.js
        const candidates = [resolved, resolved + '.js', resolved + '.mjs', resolved + '/index.js', resolved + '/index.mjs'];
        for (const c of candidates) {
          if (jsBlobUrls.has(c)) {
            return full.replace(spec, jsBlobUrls.get(c));
          }
        }
        // bare specifier left as-is (may need import map / CDN)
        return full;
      }
    ).replace(
      /\bimport\s*\(\s*["']([^"']+)["']\s*\)/g,
      (full, spec) => {
        if (/^(https?:|data:|blob:|\/\/)/i.test(spec)) return full;
        const resolved = resolvePath(dir, spec);
        const candidates = [resolved, resolved + '.js', resolved + '.mjs', resolved + '/index.js'];
        for (const c of candidates) {
          if (jsBlobUrls.has(c)) return `import("${jsBlobUrls.get(c)}")`;
        }
        return full;
      }
    );
  }
  // first pass: create placeholder blobs (will recreate after rewrite)
  for (const [fp, txt] of jsTexts) {
    const blob = new Blob([txt], { type: 'text/javascript' });
    jsBlobUrls.set(fp, URL.createObjectURL(blob));
  }
  // second pass: rewrite imports then recreate blobs
  for (const [fp, txt] of jsTexts) {
    const rewritten = rewriteImports(txt, fp);
    jsTexts.set(fp, rewritten);
    const blob = new Blob([rewritten], { type: 'text/javascript' });
    jsBlobUrls.set(fp, URL.createObjectURL(blob));
  }
  // optional import map for bare-ish paths
  if (jsBlobUrls.size) {
    const imports = {};
    for (const [fp, url] of jsBlobUrls) {
      imports['./' + fp] = url;
      imports['/' + fp] = url;
      imports[fp] = url;
    }
    const mapEl = doc.createElement('script');
    mapEl.type = 'importmap';
    mapEl.textContent = JSON.stringify({ imports }, null, 0);
    doc.head.appendChild(mapEl);
  }

  // scripts — CDN kept; local classic inlined; local modules via blob
  for (const s of Array.from(doc.querySelectorAll('script[src]'))) {
    const src = s.getAttribute('src');
    if (/^(https?:|\/\/)/i.test(src)) {
      // ensure crossorigin so errors aren't opaque "Script error."
      if (!s.hasAttribute('crossorigin')) s.setAttribute('crossorigin', 'anonymous');
      continue;
    }
    const p = resolvePath(base, src);
    const f = fileMap.get(p);
    if (!f) { warnings.push('Missing script: ' + src); continue; }
    const type = (s.getAttribute('type') || '').toLowerCase();
    const isMod = type === 'module' || (jsTexts.has(p) && /\bimport\s+|^\s*export\s/m.test(jsTexts.get(p) || ''));
    const ns = doc.createElement('script');
    for (const a of Array.from(s.attributes)) if (a.name !== 'src') ns.setAttribute(a.name, a.value);
    ns.setAttribute('data-src', p);
    if (isMod && jsBlobUrls.has(p)) {
      ns.setAttribute('type', 'module');
      ns.setAttribute('src', jsBlobUrls.get(p));
      ns.setAttribute('crossorigin', 'anonymous');
    } else {
      const js = jsTexts.get(p) || await textOfFile(f);
      ns.textContent = js;
    }
    s.replaceWith(ns);
  }


  // assets
  const assetRefs = [
    ['img[src]','src'], ['source[src]','src'], ['video[src]','src'],
    ['audio[src]','src'], ['video[poster]','poster'], ['link[rel="icon"][href]','href'],
    ['link[rel="apple-touch-icon"][href]','href'], ['input[type="image"][src]','src'],
    ['image[href]','href'], ['use[href]','href']
  ];
  for (const [sel, attr] of assetRefs) {
    for (const node of Array.from(doc.querySelectorAll(sel))) {
      const val = node.getAttribute(attr);
      if (!val) continue;
      const p = resolvePath(base, val);
      const f = fileMap.get(p);
      if (!f) { if (!/^(https?:|data:|#|\/\/)/i.test(val)) warnings.push(`Missing asset: ${val}`); continue; }
      const d = await assetToDataURL(f);
      if (d) node.setAttribute(attr, d);
    }
  }

  // srcset
  for (const node of Array.from(doc.querySelectorAll('[srcset]'))) {
    const parts = node.getAttribute('srcset').split(',').map(x => x.trim()).filter(Boolean);
    const out = [];
    for (const part of parts) {
      const [url, ...rest] = part.split(/\s+/);
      const p = resolvePath(base, url);
      const f = fileMap.get(p);
      if (f) { const d = await assetToDataURL(f); out.push([d || url, ...rest].join(' ')); }
      else out.push(part);
    }
    node.setAttribute('srcset', out.join(', '));
  }

  // inline style blocks
  for (const st of Array.from(doc.querySelectorAll('style'))) {
    st.textContent = await rewriteCssUrls(st.textContent, base, fileMap, warnings);
  }
  for (const node of Array.from(doc.querySelectorAll('[style]'))) {
    node.setAttribute('style', await rewriteCssUrls(node.getAttribute('style'), base, fileMap, warnings));
  }

  // studio.css
  const studioCssFile = fileMap.get('studio.css');
  if (studioCssFile && opts.includeStudio !== false) {
    const st = doc.createElement('style');
    st.setAttribute('data-studio', '1');
    st.textContent = await textOfFile(studioCssFile);
    doc.head.appendChild(st);
  }

  // bridge
  if (opts.visual && opts.bridgeSource) {
    const bridge = doc.createElement('script');
    bridge.setAttribute('data-nn-bridge', '1');
    bridge.textContent = opts.bridgeSource;
    doc.head.appendChild(bridge);
  }

  // Preview bootstrap: report JS errors + force-dismiss stuck intros/preloaders
  if (opts.previewBootstrap !== false) {
    const boot = doc.createElement('script');
    boot.setAttribute('data-nn-boot', '1');
    boot.textContent = `(function(){
  function report(msg, extra){
    try{parent.postMessage({type:'nn:preview-error',msg:String(msg||''),extra:extra||null},'*');}catch(e){}
  }
  window.addEventListener('error',function(e){
    var msg = e.message || 'Script error';
    var where = (e.filename || '') + (e.lineno ? (':' + e.lineno) : '');
    if (msg === 'Script error.' && !where) {
      msg = 'Script error (cross-origin CDN or blocked). Check network / CORS.';
    }
    if (e.error && e.error.stack) msg += ' | ' + String(e.error.stack).split('\n')[0];
    report(msg + (where ? (' @ ' + where) : ''), {filename:e.filename,line:e.lineno,col:e.colno});
  }, true);
  window.addEventListener('unhandledrejection',function(e){
    var r = e.reason;
    var msg = (r && r.message) ? r.message : String(r);
    if (r && r.stack) msg += ' | ' + String(r.stack).split('\n')[0];
    report('Unhandled: ' + msg);
  });
  // polyfill minimal process/env some bundles expect
  try {
    if (typeof window.process === 'undefined') window.process = { env: { NODE_ENV: 'production' } };
  } catch(e) {}

  var killed=false;
  function killIntro(){
    if(killed)return; killed=true;
    var sels=[
      '.loader','.preloader','.intro','.splash','.loading','.page-loader','.site-loader',
      '#loader','#preloader','#intro','#splash','#loading',
      '[data-loader]','[data-preloader]','[data-intro]','[data-splash]',
      '.loader-wrapper','.preloader-wrapper','.intro-wrapper','.splash-screen',
      '.loading-screen','.intro-screen','.overlay-loader'
    ];
    var removed=0;
    sels.forEach(function(sel){
      try{
        document.querySelectorAll(sel).forEach(function(el){
          el.style.setProperty('display','none','important');
          el.style.setProperty('opacity','0','important');
          el.style.setProperty('visibility','hidden','important');
          el.style.setProperty('pointer-events','none','important');
          removed++;
        });
      }catch(e){}
    });
    try{
      document.documentElement.classList.remove('loading','is-loading','preload','intro-active');
      document.body.classList.remove('loading','is-loading','preload','intro-active','overflow-hidden');
      document.documentElement.style.overflow='';
      document.body.style.overflow='';
      document.body.style.opacity='1';
      document.body.style.visibility='visible';
    }catch(e){}
    try{parent.postMessage({type:'nn:intro-killed',removed:removed},'*');}catch(e){}
  }
  // after load + safety timeouts
  window.addEventListener('load',function(){ setTimeout(killIntro, 3500); });
  setTimeout(killIntro, 5500);
  setTimeout(killIntro, 9000);
  // manual skip via double-tap / key
  window.addEventListener('message',function(e){var d=e.data;if(d&&d.type==='nn:kill-intro')killIntro();});
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') killIntro(); });
  var taps=0,tapT;
  document.addEventListener('touchend',function(){
    taps++; clearTimeout(tapT); tapT=setTimeout(function(){taps=0;},400);
    if(taps>=2) killIntro();
  },{passive:true});
})();`;
    doc.head.appendChild(boot);
  }

  // base target only — do NOT set href (breaks relative resolution of leftover URLs)
  const baseEl = doc.createElement('base');
  baseEl.setAttribute('target', '_blank');
  doc.head.insertBefore(baseEl, doc.head.firstChild);

  const doctype = /^\s*<!doctype/i.test(html) ? '<!DOCTYPE html>\n' : '<!DOCTYPE html>\n';
  return { html: doctype + doc.documentElement.outerHTML, warnings, entry: entryFile.path };
}

const Project = (() => {
  async function list() {
    const all = await DB.all('projects');
    return all.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  }
  async function get(id) { return DB.get('projects', id); }
  async function touch(id) {
    const p = await DB.get('projects', id); if (!p) return;
    p.updatedAt = Date.now(); await DB.put('projects', p);
  }
  async function updateMeta(id, patch) {
    const p = await DB.get('projects', id); if (!p) return;
    Object.assign(p, patch, { updatedAt: Date.now() });
    await DB.put('projects', p); return p;
  }

  function defaultFiles() {
    return [
      { path: 'index.html', content: `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Site</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>Hello, world</h1>
    <p>Built with NONONICK Studio.</p>
    <button class="cta" id="cta">Tap me</button>
  </header>
  <script src="script.js"><\/script>
</body>
</html>` },
      { path: 'style.css', content: `* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: #0b0b12;
  color: #f2f2f7;
}
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;

  background: radial-gradient(circle at 50% 30%, #1b2a5e, #0b0b12 70%);
}
.hero h1 { font-size: 2.4rem; margin: 0 0 12px; }
.hero p { color: #9a9ab5; margin: 0 0 28px; }
.cta {
  padding: 14px 28px;
  border: 0;

}` },
      { path: 'script.js', content: `document.getElementById('cta')?.addEventListener('click', () => {
  alert('It works!');
});` }
    ];
  }

  async function create(name, files = null) {
    const id = uid(); const now = Date.now();
    const project = { id, name: name || 'Untitled Project', createdAt: now, updatedAt: now, entry: 'index.html', type: 'web' };
    await DB.put('projects', project);
    if (!files) files = defaultFiles();
    for (const f of files) await writeFile(id, f.path, f.content, f.mime);
    await touch(id);
    return project;
  }

  async function writeFile(projectId, path, content, mime) {
    path = normalizePath(path);
    const rec = {
      id: projectId + '::' + path, projectId, path,
      mime: mime || mimeOf(path),
      size: content instanceof Blob ? content.size : new Blob([String(content)]).size,
      content, isText: !(content instanceof Blob)
    };
    return DB.put('files', rec);
  }

  async function readFile(projectId, path) {
    return DB.get('files', projectId + '::' + normalizePath(path));
  }
  async function readFileContent(projectId, path) {
    const r = await readFile(projectId, path);
    if (!r) return null;
    return r.content instanceof Blob ? await r.content.text() : r.content;
  }
  async function deleteFile(projectId, path) {
    return DB.del('files', projectId + '::' + normalizePath(path));
  }
  async function listMeta(projectId) {
    const rows = await DB.byIndex('files', 'projectId', projectId);
    return rows.map(r => ({ path: r.path, size: r.size, mime: r.mime, isText: r.isText }))
      .sort((a, b) => a.path.localeCompare(b.path));
  }
  async function listFull(projectId) { return DB.byIndex('files', 'projectId', projectId); }

  async function deleteProject(id) {
    await DB.del('projects', id);
    await DB.deleteByIndex('files', 'projectId', id);
    await DB.deleteByIndex('snapshots', 'projectId', id);
  }
  async function duplicate(id) {
    const p = await get(id); if (!p) return null;
    const files = await listFull(id);
    const np = { ...p, id: uid(), name: p.name + ' Copy', createdAt: Date.now(), updatedAt: Date.now() };
    await DB.put('projects', np);
    for (const f of files) await DB.put('files', { ...f, id: np.id + '::' + f.path, projectId: np.id });
    return np;
  }
  async function rename(id, name) {
    const p = await get(id); if (!p) return;
    p.name = name; p.updatedAt = Date.now(); await DB.put('projects', p); return p;
  }

  async function stats(id) {
    const files = await listMeta(id);
    const count = files.length;
    const size = files.reduce((a, f) => a + (f.size || 0), 0);
    const hasHTML = files.some(f => /\.html?$/i.test(f.path));
    const hasCSS = files.some(f => /\.css$/i.test(f.path));
    const hasJS = files.some(f => /\.m?js$/i.test(f.path));
    const type = hasHTML ? 'Web' : hasJS ? 'Script' : hasCSS ? 'Styles' : 'Files';
    return { count, size, type, hasHTML, entry: findEntryPath(files) };
  }

  async function snapshot(projectId, label = 'snapshot') {
    const files = await listFull(projectId);
    const payload = [];
    for (const f of files) {
      if (f.content instanceof Blob) {
        payload.push({ path: f.path, binary: true, mime: f.mime, data: await blobToBase64(f.content) });
      } else {
        payload.push({ path: f.path, binary: false, mime: f.mime, data: f.content });
      }
    }
    const snap = { id: uid(), projectId, label, at: Date.now(), files: payload };
    await DB.put('snapshots', snap);
    const allSnaps = (await DB.byIndex('snapshots', 'projectId', projectId)).sort((a, b) => b.at - a.at);
    for (let i = 15; i < allSnaps.length; i++) await DB.del('snapshots', allSnaps[i].id);
    return snap;
  }
  async function listSnapshots(projectId) {
    const all = await DB.byIndex('snapshots', 'projectId', projectId);
    return all.sort((a, b) => b.at - a.at);
  }
  async function restoreSnapshot(projectId, snapId) {
    const snap = await DB.get('snapshots', snapId);
    if (!snap) return false;
    const existing = await listFull(projectId);
    for (const f of existing) await DB.del('files', f.id);
    for (const f of snap.files) {
      if (f.binary) await writeFile(projectId, f.path, base64ToBlob(f.data, f.mime), f.mime);
      else await writeFile(projectId, f.path, f.data, f.mime);
    }
    await touch(projectId);
    return true;
  }
  function blobToBase64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1] || '');
      r.onerror = () => rej(r.error);
      r.readAsDataURL(blob);
    });
  }
  function base64ToBlob(b64, mime) {
    const bin = atob(b64); const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([u8], { type: mime || 'application/octet-stream' });
  }

  return { list, get, create, touch, updateMeta, writeFile, readFile, readFileContent, deleteFile, listMeta, listFull, deleteProject, duplicate, rename, stats, snapshot, listSnapshots, restoreSnapshot, defaultFiles };
})();

  for (const f of files) {
    const k = f.path.toLowerCase();
    if (seen.has(k)) diagnostics.push({ level: 'warn', msg: `Duplicate path (case-insensitive): ${f.path}`, file: f.path });
    seen.set(k, f);
  }
  for (const f of files) if (f.size === 0) diagnostics.push({ level: 'info', msg: 'File is empty.', file: f.path });

  for (const file of files) {
    const e = extname(file.path);
    const isHTML = e === 'html' || e === 'htm' || e === 'xhtml';

    if (isHTML && file._content) {
      const base = dirname(file.path);
      const refRe = /(?:src|href|poster)\s*=\s*["']([^"']+)["']/gi;
      let m;
      while ((m = refRe.exec(file._content))) {
        const ref = m[1].trim();
        if (!ref || /^(https?:|data:|blob:|mailto:|tel:|#|\/\/|javascript:)/i.test(ref)) continue;
        const p = resolvePath(base, ref);
        if (p && !paths.has(p)) diagnostics.push({ level: 'error', msg: `Broken reference: ${ref}`, file: file.path });
      }
      const urlRe = /url\(\s*['"]?([^'")]+)['"]?\s*\)/gi;
      while ((m = urlRe.exec(file._content))) {
        const ref = m[1].trim();
        if (!ref || /^(https?:|data:|blob:|#|\/\/)/i.test(ref)) continue;
        const p = resolvePath(base, ref);
        if (!paths.has(p)) diagnostics.push({ level: 'warn', msg: `Missing asset in style: ${ref}`, file: file.path });
      }
      const open = (file._content.match(/<([a-zA-Z][\w:-]*)(?:\s[^>]*)?(?<!\/)>/g) || []).length;
      const close = (file._content.match(/<\/[a-zA-Z][\w:-]*>/g) || []).length;
      if (open - close > 3) diagnostics.push({ level: 'warn', msg: `Possible unclosed tags (${open} open / ${close} close).`, file: file.path });
      if (!/<title[^>]*>\s*\S/i.test(file._content)) diagnostics.push({ level: 'info', msg: 'HTML has no non-empty <title>.', file: file.path });
      if (!/name\s*=\s*["']viewport["']/i.test(file._content)) diagnostics.push({ level: 'info', msg: 'Missing meta viewport.', file: file.path });
    }

    if (e === 'css' && file._content) {
      const base = dirname(file.path);
      const urlRe = /url\(\s*['"]?([^'")]+)['"]?\s*\)/gi;
      let m;
      while ((m = urlRe.exec(file._content))) {
        const ref = m[1].trim();
        if (!ref || /^(https?:|data:|blob:|#|\/\/)/i.test(ref)) continue;
        const p = resolvePath(base, ref);
        if (!paths.has(p)) diagnostics.push({ level: 'warn', msg: `Missing CSS asset: ${ref}`, file: file.path });
      }
      const braces = (file._content.match(/{/g) || []).length - (file._content.match(/}/g) || []).length;
      if (braces !== 0) diagnostics.push({ level: 'warn', msg: `Unbalanced braces (${braces > 0 ? braces + ' unclosed' : Math.abs(braces) + ' extra'}).`, file: file.path });
    }

    if ((e === 'js' || e === 'mjs') && file._content) {
      try { new Function(file._content); }
      catch (err) { diagnostics.push({ level: 'error', msg: `JavaScript syntax error: ${err.message}`, file: file.path }); }
    }
  }

  const order = { error: 0, warn: 1, info: 2 };
  diagnostics.sort((a, b) => order[a.level] - order[b.level]);
  return diagnostics;
}

const AI_SYSTEM = `You are a senior front-end engineer embedded in a mobile code studio.

You will be given the current project files. Respond ONLY with a JSON object of the form:

{
  "summary": "one-sentence description of what changed",
  "files": [
    { "path": "relative/path.ext", "content": "FULL new file content" }
  ]
}

Rules:
- Only include files you are CHANGING or CREATING.
- "content" must be the COMPLETE new file contents, never a diff or a fragment.
- Preserve everything not related to the request.
- If the user asks a question rather than requesting a change, return {"summary":"<answer>","files":[]}.
- Output raw JSON. No markdown fences, no prose outside the JSON.`;

async function askAI({ prompt, files, activePath, history = [] }) {
  const { endpoint, model, key } = await getAISettings();
  if (!key) throw new Error('No API key configured. Open Tools → AI to add one.');
  const context = files.map(f => {
    const body = typeof f.content === 'string' ? f.content : '[binary file]';
    const truncated = body.length > 24000 ? body.slice(0, 24000) + '\n/* …truncated… */' : body;
    return `--- FILE: ${f.path} ---\n${truncated}`;
  }).join('\n\n');
  const messages = [
    { role: 'system', content: AI_SYSTEM },
    ...history,
    { role: 'user', content: `PROJECT FILES:\n\n${context}\n\nACTIVE FILE: ${activePath || 'none'}\n\nREQUEST:\n${prompt}` }
  ];
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({ model, messages, temperature: 0.2, response_format: { type: 'json_object' } })
  });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`AI request failed (${res.status}): ${text.slice(0, 300)}`);
  }
  const data = await res.json();
  const raw = data.choices?.[0]?.message?.content || '';
  return parseAIResponse(raw);
}
function parseAIResponse(raw) {
  let text = String(raw).trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try {
    const obj = JSON.parse(text);
    if (!obj || typeof obj !== 'object') throw new Error('bad');
    return {
      summary: obj.summary || '',
      files: Array.isArray(obj.files) ? obj.files.filter(f => f && f.path && typeof f.content === 'string') : []
    };
  } catch {
    return { summary: text, files: [], raw: text };
  }
}
function lineDiff(oldText, newText) {
  const a = String(oldText ?? '').split('\n');
  const b = String(newText ?? '').split('\n');
  const MAX = 1200;
  if (a.length > MAX || b.length > MAX) return [{ t: 'ctx', s: `(file too large for inline diff: ${a.length} → ${b.length} lines)` }];
  const dp = Array.from({ length: a.length + 1 }, () => new Uint16Array(b.length + 1));
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = b.length - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const out = []; let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { out.push({ t: 'ctx', s: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: 'del', s: a[i] }); i++; }
    else { out.push({ t: 'add', s: b[j] }); j++; }
  }
  while (i < a.length) out.push({ t: 'del', s: a[i++] });
  while (j < b.length) out.push({ t: 'add', s: b[j++] });
  const collapsed = []; let run = 0;
  for (const l of out) {
    if (l.t === 'ctx') { run++; if (run > 6) { if (run === 7) collapsed.push({ t: 'ctx', s: '…' }); continue; } }
    else run = 0;
    collapsed.push(l);
  }
  return collapsed;
}

const GH = (() => {
  const API = 'https://api.github.com';
  async function getToken() { return DB.getSetting('gh_token', ''); }
  async function setToken(t) { return DB.setSetting('gh_token', t || ''); }
  async function gh(path, opts = {}) {
    const token = await getToken();
    if (!token) throw new Error('Not connected. Add a GitHub token first.');
    const res = await fetch(API + path, {
      ...opts,
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + token,
        'X-GitHub-Api-Version': '2022-11-28',
        ...(opts.headers || {})
      }
    });
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error(`GitHub ${res.status}: ${t.slice(0, 240)}`);
    }
    return res.status === 204 ? null : res.json();
  }
  async function whoami() { return gh('/user'); }
  async function listRepos() { return gh('/user/repos?per_page=100&sort=updated'); }
  async function importRepo(fullName, branch) {
    const [owner, repo] = fullName.split('/');
    const info = branch ? null : await gh(`/repos/${owner}/${repo}`);
    const ref = branch || info.default_branch || 'main';
    const res = await fetch(`${API}/repos/${owner}/${repo}/zipball/${ref}`, {
      headers: { 'Authorization': 'Bearer ' + (await getToken()) }
    });
    if (!res.ok) throw new Error(`Download failed: ${res.status}`);
    const blob = await res.blob();
    const entries = await ZIP.readZip(blob);
    let prefix = '';
    if (entries.length) {
      const first = entries[0].path;
      const slash = first.indexOf('/');
      if (slash > 0) {
        const p = first.slice(0, slash);
        if (entries.every(e => e.path.startsWith(p + '/'))) prefix = p + '/';
      }
    }
    return entries.map(e => ({
      path: prefix && e.path.startsWith(prefix) ? e.path.slice(prefix.length) : e.path,
      data: e.data
    }));
  }
  async function toBase64(file) {
    const blob = file.content instanceof Blob ? file.content : new Blob([String(file.content)], { type: 'text/plain' });
    const buf = new Uint8Array(await blob.arrayBuffer());
    let bin = ''; const chunk = 0x8000;
    for (let i = 0; i < buf.length; i += chunk) bin += String.fromCharCode.apply(null, buf.subarray(i, i + chunk));
    return btoa(bin);
  }
  async function publishProject(fullName, branch, files, commitMessage) {
    const [owner, repo] = fullName.split('/');
    const ref = branch || 'main';
    const results = [];
    for (const f of files) {
      let sha;
      try {
        const existing = await gh(`/repos/${owner}/${repo}/contents/${encodeURIComponent(f.path)}?ref=${ref}`);
        sha = existing.sha;
      } catch {}
      const body = { message: commitMessage || `Update ${f.path} from NONONICK Studio`, content: await toBase64(f), branch: ref };
      if (sha) body.sha = sha;
      const out = await gh(`/repos/${owner}/${repo}/contents/${encodeURIComponent(f.path)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      results.push({ path: f.path, url: out?.content?.html_url });
    }
    return results;
  }
  return { getToken, setToken, whoami, listRepos, importRepo, publishProject };
})();

async function importFileList(fileList) {

/* ---------- import zip ---------- */
async function onZipInput(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;
  toast('Extracting…');
  let entries;
  try { entries = await ZIP.readZip(file); }
  catch (err) { return toast('ZIP read failed: ' + err.message, 4000); }
  if (!entries.length) return toast('ZIP is empty');

  let prefix = '';
  const first = entries[0].path;
  if (first.includes('/')) {
    const root = first.split('/')[0];
    if (entries.every(x => x.path.startsWith(root + '/'))) prefix = root + '/';
  }
  const cleaned = entries
    .map(x => ({ ...x, path: prefix ? x.path.slice(prefix.length) : x.path }))
    .filter(x => x.path && !x.path.startsWith('__MACOSX') && !x.path.endsWith('.DS_Store'));

  const name = prefix ? prefix.replace(/\/$/, '') : file.name.replace(/\.zip$/i, '');
  const proj = await Project.create(name, []);

  let count = 0;
  for (const entry of cleaned) {
    const p = normalizePath(entry.path);
    if (!p) continue;
    let content;
    if (isTextFile(p)) {
      try { content = new TextDecoder('utf-8').decode(entry.data); }
      catch { content = new Blob([entry.data], { type: mimeOf(p) }); }
    } else content = new Blob([entry.data], { type: mimeOf(p) });
    await Project.writeFile(proj.id, p, content, mimeOf(p));
    count++;
  }
  const meta = await Project.listMeta(proj.id);
  const entryPath = findEntryPath(meta);
  await Project.updateMeta(proj.id, { entry: entryPath || 'index.html' });
  await refreshProjects();
  await openProject(proj.id);
  toast(`Imported ${count} files${entryPath ? '' : ' — no HTML entry found'}`);
}

/* ---------- file tree ---------- */
function buildTree(paths) {
  const root = { name: '', children: new Map(), path: '' };
  for (const f of paths) {
    const parts = f.path.split('/');
    let node = root;
    for (let i = 0; i < parts.length; i++) {
      const isLeaf = i === parts.length - 1;
      const key = parts[i];
      if (!node.children.has(key)) {
        node.children.set(key, {
          name: key, children: new Map(),
          path: parts.slice(0, i + 1).join('/'),
          isFile: isLeaf, meta: isLeaf ? f : null
        });
      }
      node = node.children.get(key);
      if (isLeaf) { node.isFile = true; node.meta = f; }
    }
  }
  return root;
}
function renderFileTree(filter = '') {
  const tree = $('#file-tree');
  tree.innerHTML = '';
  if (!state.project) { tree.appendChild(h('div', { class: 'empty' }, 'No project open.')); return; }
  let files = state.fileMeta;
  if (filter) {
    const f = filter.toLowerCase();
    files = files.filter(x => x.path.toLowerCase().includes(f));
  }
  if (!files.length) { tree.appendChild(h('div', { class: 'empty' }, 'No files.')); return; }

function renderNodes(children, parent, depth) {

    return a.name.localeCompare(b.name);
  });
  for (const node of sorted) {
    if (node.isFile) {
      const ext = extname(node.name);
      const icon = isImage(node.path) ? '🖼' : isVideo(node.path) ? '🎬' : isAudio(node.path) ? '🎵'
        : isFont(node.path) ? '🔤' : ext === 'html' || ext === 'htm' ? '🌐'
        : ext === 'css' ? '🎨' : ext === 'js' || ext === 'mjs' ? '⚡'
        : ext === 'json' ? '🧾' : ext === 'md' ? '📝' : ext === 'svg' ? '🔷' : '📄';
      const row = h('div', {
        class: 'tnode' + (state.activePath === node.path ? ' active' : ''),
        onclick: () => openFile(node.path),
        oncontextmenu: (e) => { e.preventDefault(); fileActions(node.path); }
      },
        h('span', { class: 'ico', text: icon }),
        h('span', { class: 'nm', text: node.name }),
        h('span', { class: 'sz', text: fmtSize(node.meta?.size || 0) }),
        h('button', { class: 'sz', style: 'padding:0 4px', onclick: (e) => { e.stopPropagation(); fileActions(node.path); } }, '⋯')
      );
      parent.appendChild(row);
    } else {
      const wrap = h('div', {});
      const row = h('div', { class: 'tnode folder' },
        h('span', { class: 'ico', text: '📁' }),
        h('span', { class: 'nm', text: node.name }),
        h('span', { class: 'sz', text: String(countFiles(node)) })
      );
      const kids = h('div', { class: 'tchildren' });
      let open = true;
      const toggle = () => { open = !open; kids.style.display = open ? '' : 'none'; row.querySelector('.ico').textContent = open ? '📁' : '📂'; };
      row.addEventListener('click', toggle);
      row.addEventListener('contextmenu', (e) => { e.preventDefault(); folderActions(node.path); });
      renderNodes(node.children, kids, depth + 1);
      wrap.appendChild(row); wrap.appendChild(kids);
      parent.appendChild(wrap);

}
function countFiles(node) {
  let n = 0;
  for (const c of node.children.values()) n += c.isFile ? 1 : countFiles(c);
  return n;
}

async function folderActions(path) {

async function renameFile(path) {
  const newName = prompt('New name:', basename(path));
  if (!newName || newName === basename(path)) return;
  const dir = dirname(path);
  const newPath = normalizePath(dir ? dir + '/' + newName : newName);
  const content = await getContent(path);
  await Project.writeFile(state.project.id, newPath, content, mimeOf(newPath));
  await Project.deleteFile(state.project.id, path);
  state.contents.delete(path);
  state.fileMeta = await Project.listMeta(state.project.id);
  if (state.activePath === path) state.activePath = newPath;
  state.tabs = state.tabs.map(t => t === path ? newPath : t);
  renderFileTree(); renderTabs();
  if (state.project.entry === path) await Project.updateMeta(state.project.id, { entry: newPath });
  scheduleRefresh(true);
  toast('Renamed');
}
async function duplicateFile(path) {
  const ext = extname(path);
  const base = basename(path);
  const dir = dirname(path);
  const stem = ext ? base.slice(0, -(ext.length + 1)) : base;
  const newName = `${stem}-copy.${ext}`;
  const newPath = normalizePath(dir ? dir + '/' + newName : newName);
  const content = await getContent(path);
  await Project.writeFile(state.project.id, newPath, content, mimeOf(newPath));
  state.fileMeta = await Project.listMeta(state.project.id);
  renderFileTree();
  toast('Duplicated');
}
async function shareFile(path) {
  const content = await getContent(path);
  const blob = content instanceof Blob ? content : new Blob([content], { type: mimeOf(path) });
  const file = new File([blob], basename(path), { type: blob.type || mimeOf(path) });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch {}
  }
  ZIP.downloadBlob(blob, basename(path));
}

/* ---------- content ---------- */
async function getContent(path) {
  if (state.contents.has(path)) return state.contents.get(path);
  const rec = await Project.readFile(state.project.id, path);
  if (!rec) return null;
  state.contents.set(path, rec.content);
  return rec.content;
}
async function loadAllFiles(projectId) {
  const rows = await Project.listFull(projectId);
  return rows.map(r => ({ path: r.path, content: r.content, mime: r.mime, size: r.size }));
}

/* ---------- tabs ---------- */
async function openFile(path) {
  if (!state.project) return;
  const meta = state.fileMeta.find(f => f.path === path);
  if (!state.tabs.includes(path)) state.tabs.push(path);
  state.activePath = path;
  renderTabs();
  renderFileTree();

  if (meta && !meta.isText) {
    editor.open(path, `[binary file — ${fmtSize(meta.size)}]\n\nUse Tools → Assets to preview, replace or export.`, 'text');
    switchView('editor');
    return;
  }
  const content = await getContent(path);
  editor.open(path, typeof content === 'string' ? content : '', langOf(path));
  switchView('editor');
  setEditorMode(state.mode);
  scheduleRefresh();
}
function renderTabs() {
  const strip = $('#editor-tabs');
  strip.innerHTML = '';
  for (const path of state.tabs) {
    const tab = h('div', { class: 'etab' + (path === state.activePath ? ' active' : ''), onclick: () => openFile(path) },
      h('span', { class: 'nm', text: basename(path) }),
      h('span', { class: 'x', onclick: (e) => { e.stopPropagation(); closeTab(path); } }, '✕')
    );
    strip.appendChild(tab);
  }
}
function closeTab(path) {
  state.tabs = state.tabs.filter(t => t !== path);
  if (state.activePath === path) {
    const next = state.tabs[state.tabs.length - 1];
    if (next) openFile(next);
    else { state.activePath = null; editor.open('', '', 'text'); }
  }
  renderTabs();
}

/* ---------- editor changes ---------- */
function onEditorChange(value) {
  if (!state.activePath || !state.project) return;
  state.contents.set(state.activePath, value);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await Project.writeFile(state.project.id, state.activePath, value, mimeOf(state.activePath));
    if (state.project.entry === state.activePath || (!state.project.entry && /\.html?$/i.test(state.activePath))) {
      await Project.updateMeta(state.project.id, { entry: state.activePath });
      state.project.entry = state.activePath;
    }
    if (state.activePath === 'studio.css') state.studioCSS = value;
    scheduleRefresh();
  }, 500);
}

function setEditorMode(mode) {
  state.mode = mode;
  $('#view-editor').setAttribute('data-mode', mode);
  $$('#editor-modes .mode').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if (mode === 'split' || mode === 'visual') refreshPreview();
}

/* ---------- preview ---------- */
function scheduleRefresh(force = false) {
  if (!state.autoRefresh && !force) return;
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => refreshPreview(), 320);
}
function resolvePreviewEntry(files) {
  if (state.activePath && /\.html?$/i.test(state.activePath)) {
    if (files.some(f => f.path === state.activePath)) return state.activePath;
  }
  if (state.project?.entry && files.some(f => f.path === state.project.entry)) return state.project.entry;
  const htmlFiles = files.filter(f => /\.html?$/i.test(f.path));
  const isStub = (f) => {
    const c = typeof f.content === 'string' ? f.content : '';
    return /Built with NONONICK Studio/i.test(c) && /Hello,\s*world/i.test(c);
  };
  const real = htmlFiles.find(f => !isStub(f));
  if (real) return real.path;
  return findEntryPath(files);
}
async function buildPreviewHTML() {
  if (!state.project) return null;
  const rows = await Project.listFull(state.project.id);
  const files = [];
  for (const r of rows) {
    const cached = state.contents.get(r.path);
    files.push({ path: r.path, content: cached !== undefined ? cached : r.content, mime: r.mime });
  }
  const entry = resolvePreviewEntry(files);
  if (!entry) return { html: null, warnings: ['No HTML entry file'], entry: null };
  if (state.project.entry !== entry) {
    state.project.entry = entry;
    Project.updateMeta(state.project.id, { entry }).catch(() => {});
  }
  const result = await buildBundle(files, entry, { visual: true, bridgeSource: BRIDGE_SOURCE });
  return { ...result, entry };
}

    if (badge) badge.textContent = entry ? basename(entry) : '—';
    if (!html) {
      target.setHTML('<html><body style="font-family:-apple-system,sans-serif;background:#0b0b12;color:#8b8ba6;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:24px"><div><h2 style="color:#e9e9f2;font-size:16px;margin:0 0 8px">Nothing to preview</h2><p style="font-size:13px;margin:0">' + escapeHtml((warnings || []).join('<br>')) + '</p></div></body></html>');
      return;
    }
    state.lastBundleWarnings = warnings || [];
    if (warnings && warnings.length) console.warn('Bundle warnings', warnings);
    target.setHTML(html);
    if (state.device) target.setDevice(state.device);
    $$('.preview-frame-wrap').forEach(w => w.classList.toggle('select-mode', !!state.visualEnabled));
    if (state.visualEnabled) {

  } catch (err) {
    target.setHTML('<html><body style="font-family:-apple-system,sans-serif;background:#1a0a0a;color:#fca5a5;padding:24px;font-size:13px"><h3>Preview error</h3><pre style="white-space:pre-wrap">' + escapeHtml(err.message) + '</pre></body></html>');

}
function currentPreview() {
  if (state.mode === 'split' || state.mode === 'visual') return splitPreview;

}

/* ---------- visual editor ---------- */
function toggleVisual() {

function onPreviewMessage(e) {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'nn:selected') {
    const srcPreview = (preview && e.source === preview.iframe?.contentWindow) ? preview
      : (splitPreview && e.source === splitPreview.iframe?.contentWindow) ? splitPreview
      : currentPreview();
    state.selection = { info: d.info, selector: d.info.selector, path: d.info.path, preview: srcPreview };
    renderVisualToolbar();
  }
  if (d.type === 'nn:style-applied') persistRule(d.selector, d.prop, d.value);
  if (d.type === 'nn:preview-error') {
    console.warn('[preview]', d.msg);
    toast('JS: ' + String(d.msg).slice(0, 80), 3500);
  }
  if (d.type === 'nn:intro-killed') {
    if (d.removed > 0) toast('Intro dismissed (' + d.removed + ')', 1500);
  }
}

async function persistRule(selector, prop, value) {
  if (!state.project) return;
  state.studioCSS = upsertRule(state.studioCSS, selector, prop, value);
  state.contents.set('studio.css', state.studioCSS);
  await Project.writeFile(state.project.id, 'studio.css', state.studioCSS, 'text/css');
  if (!state.fileMeta.find(f => f.path === 'studio.css')) {
    state.fileMeta = await Project.listMeta(state.project.id);
    renderFileTree();
  }
}

async function applyTextEdit(newText) {
  const sel = state.selection;
  if (!sel) return;
  const htmlPath = findOwningHTML();
  if (!htmlPath) return toast('Could not locate source file');
  await snapshot('Before text edit');
  const src = await getContent(htmlPath);
  const doc = new DOMParser().parseFromString(src, 'text/html');
  const el = elFromPath(doc.body, sel.path);
  if (!el) return toast('Element not found in source');
  el.textContent = newText;
  await writeSource(htmlPath, serializeDoc(doc, src));
  if (sel.preview) sel.preview.post({ type: 'nn:set-text', path: sel.path, value: newText });
  await openFileIfActive(htmlPath);
  scheduleRefresh(true);
  toast('Text updated');
}

function styleSheet() {
  if (!state.selection) return;
  const sel = state.selection;
  const css = state.studioCSS;
  const container = h('div', {});
  container.appendChild(h('div', { class: 'hint' },
    h('code', { style: 'color:var(--neon)', text: sel.selector }),
    ' — changes are written to studio.css.'
  ));
  for (const section of VISUAL_CONTROLS) {
    if (section.section === 'Image' && !sel.info.isImage) continue;
    const details = h('details', { style: 'margin:10px 0;border:1px solid var(--line);border-radius:12px;padding:10px' });
    details.appendChild(h('summary', { style: 'cursor:pointer;font-weight:600;font-size:13px' }, section.section));
    const body = h('div', { style: 'margin-top:10px' });
    for (const item of section.items) {
      const current = ruleValue(css, sel.selector, item.prop) || normalizeComputed(item.prop, sel.info.styles[item.prop]);
      const row = h('div', { class: 'prop-row' });
      row.appendChild(h('label', { text: item.label }));
      let input;
      if (item.type === 'select') {
        input = h('select', {});
        for (const opt of item.options) {
          const o = h('option', { value: opt }, opt === '' ? '—' : opt);
          if (opt === current) o.selected = true;
          input.appendChild(o);
        }
      } else if (item.type === 'color') input = h('input', { type: 'color', value: toHex(current) || '#000000' });
      else if (item.type === 'range') input = h('input', { type: 'range', min: item.min, max: item.max, step: item.step, value: current || '1' });
      else input = h('input', { type: 'text', value: current || '', placeholder: item.placeholder || '' });

      const commit = () => {
        let v = input.value;
        if (v === '—') v = '';
        if (state.selection) {
          state.selection.preview?.post({
            type: 'nn:set-style', path: state.selection.path, prop: item.prop,
            value: v + (v ? ' !important' : '')
          });
        }
      };
      input.addEventListener('change', commit);
      if (item.type === 'range') input.addEventListener('input', commit);
      row.appendChild(input);
      body.appendChild(row);
    }
    details.appendChild(body);
    container.appendChild(details);
  }
  container.appendChild(h('button', {
    class: 'btn', style: 'width:100%;margin-top:8px',
    onclick: async () => {
      const map = parseRules(state.studioCSS);
      map.delete(sel.selector);
      state.studioCSS = serializeRules(map);
      state.contents.set('studio.css', state.studioCSS);
      await Project.writeFile(state.project.id, 'studio.css', state.studioCSS, 'text/css');
      closeSheet(); scheduleRefresh(true);
      toast('Visual overrides cleared for this element');
    }
  }, 'Clear overrides for this element'));
  openSheet('Style — ' + sel.selector.split('>').pop().trim(), container);
}
function normalizeComputed(prop, value) {
  if (!value) return '';
  if (prop === 'backgroundColor' && value === 'rgba(0, 0, 0, 0)') return '';
  if (prop === 'borderStyle' && value === 'none') return '';
  if (/^0(px)?$/.test(value)) return '0';
  return value;
}
function toHex(cssColor) {
  if (!cssColor) return '';
  if (cssColor.startsWith('#')) return cssColor.slice(0, 7);
  const m = cssColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!m) return '';
  const to = (n) => (+n).toString(16).padStart(2, '0');
  return '#' + to(m[1]) + to(m[2]) + to(m[3]);
}
async function resetElementStyles() {
  if (!state.selection) return;
  const map = parseRules(state.studioCSS);
  map.delete(state.selection.selector);
  state.studioCSS = serializeRules(map);
  state.contents.set('studio.css', state.studioCSS);
  await Project.writeFile(state.project.id, 'studio.css', state.studioCSS, 'text/css');
  scheduleRefresh(true);
  toast('Styles reset');
}

async function duplicateElement() {
  const sel = state.selection; if (!sel) return;
  const htmlPath = findOwningHTML(); if (!htmlPath) return toast('Source file not found');
  await snapshot('Before duplicate');
  const src = await getContent(htmlPath);
  const doc = new DOMParser().parseFromString(src, 'text/html');
  const el = elFromPath(doc.body, sel.path);
  if (!el) return toast('Element not found');
  el.parentNode.insertBefore(el.cloneNode(true), el.nextSibling);
  await writeSource(htmlPath, serializeDoc(doc, src));
  await openFileIfActive(htmlPath);
  scheduleRefresh(true);
  toast('Duplicated');
}
async function deleteElement() {
  const sel = state.selection; if (!sel) return;
  if (!confirm('Delete this element?')) return;
  const htmlPath = findOwningHTML(); if (!htmlPath) return toast('Source file not found');
  await snapshot('Before delete');
  const src = await getContent(htmlPath);
  const doc = new DOMParser().parseFromString(src, 'text/html');
  const el = elFromPath(doc.body, sel.path);
  if (!el) return toast('Element not found');
  el.remove();
  await writeSource(htmlPath, serializeDoc(doc, src));
  state.selection = null;
  renderVisualToolbar();
  await openFileIfActive(htmlPath);
  scheduleRefresh(true);
  toast('Deleted');
}
async function moveElement(delta) {
  const sel = state.selection; if (!sel) return;
  const htmlPath = findOwningHTML(); if (!htmlPath) return toast('Source file not found');
  const src = await getContent(htmlPath);
  const doc = new DOMParser().parseFromString(src, 'text/html');
  const el = elFromPath(doc.body, sel.path);
  if (!el || !el.parentNode) return toast('Cannot move');
  const parent = el.parentNode;
  const idx = Array.prototype.indexOf.call(parent.children, el);
  const target = idx + delta;
  if (target < 0 || target >= parent.children.length) return toast('Already at edge');
  await snapshot('Before move');
  if (delta < 0) parent.insertBefore(el, parent.children[target]);
  else parent.insertBefore(el, parent.children[target].nextSibling);
  await writeSource(htmlPath, serializeDoc(doc, src));
  state.selection = { ...sel, path: pathOfInBody(doc.body, el) };
  await openFileIfActive(htmlPath);
  scheduleRefresh(true);
  toast('Moved');
}
function locateInCode() {
  const sel = state.selection; if (!sel) return;
  const htmlPath = findOwningHTML(); if (!htmlPath) return toast('Source file not found');
  openFile(htmlPath).then(() => {
    const src = editor.getValue();
    const info = sel.info;
    const needle = info.id ? `id="${info.id}"` : info.cls ? `class="${info.cls.split(' ')[0]}"` : `<${info.tag}`;
    const idx = src.indexOf(needle);
    if (idx < 0) return toast('Could not locate in source');
    const line = src.slice(0, idx).split('\n').length;
    editor.jumpToLine(line);
    toast('Jumped to line ' + line);
  });
}

async function onImageReplace(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file || !_replaceTarget) return;
  const sel = _replaceTarget;
  const htmlPath = findOwningHTML(); if (!htmlPath) return toast('Source file not found');
  await snapshot('Before image replace');
  const src = await getContent(htmlPath);
  const doc = new DOMParser().parseFromString(src, 'text/html');
  const el = elFromPath(doc.body, sel.path);
  if (!el) return toast('Element not found');
  const currentSrc = el.getAttribute('src') || '';
  const base = dirname(htmlPath);
  const targetPath = resolvePath(base, currentSrc) || normalizePath(dirname(htmlPath) + '/' + file.name);
  await Project.writeFile(state.project.id, targetPath, file.slice(0, file.size, file.type), file.type);
  state.contents.delete(targetPath);
  if (!currentSrc) {
    el.setAttribute('src', file.name);
    await writeSource(htmlPath, serializeDoc(doc, src));
  }
  state.fileMeta = await Project.listMeta(state.project.id);
  renderFileTree();
  scheduleRefresh(true);
  toast('Image replaced: ' + targetPath);
}

function findOwningHTML() {
  const entry = state.project?.entry;
  if (entry && /\.html?$/i.test(entry)) return entry;
  const html = state.fileMeta.find(f => /\.html?$/i.test(f.path));
  return html?.path || null;
}
function elFromPath(body, path) {
  let n = body;
  for (const i of path) {
    if (!n || !n.children[i]) return null;
    n = n.children[i];
  }
  return n;
}
function pathOfInBody(body, el) {
  const p = []; let n = el;
  while (n && n !== body && n.parentNode) {
    p.unshift(Array.prototype.indexOf.call(n.parentNode.children, n));
    n = n.parentNode;
  }
  return p;
}
function serializeDoc(doc, original) {

  return (hadDoctype ? '<!DOCTYPE html>\n' : '') + doc.documentElement.outerHTML;
}
async function writeSource(path, content) {

  await Project.writeFile(state.project.id, path, content, mimeOf(path));
  await Project.touch(state.project.id);
}

  const blob = await ZIP.createZip(entries);

  toast('ZIP exported (' + entries.length + ' files)');

function renderAIDiff(result, originalFiles) {

  if (!result.files.length) { body.appendChild(h('div', { class: 'empty' }, 'No file changes proposed.')); return; }
  const origMap = new Map(originalFiles.map(f => [f.path, f.content]));

  body.appendChild(h('div', { style: 'font-size:12px;color:var(--dim);margin:10px 0 4px' }, 'FILES AFFECTED'));
  for (const f of result.files) {
