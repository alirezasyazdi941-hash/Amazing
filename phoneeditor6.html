    body.appendChild(h('div', { class: 'badge', style: 'margin:2px 4px 2px 0' }, (oldContent === undefined ? '＋ ' : '✎ ') + f.path));
  }
  for (const f of result.files) {
    const oldContent = origMap.get(f.path) ?? '';
    body.appendChild(h('div', { style: 'margin-top:16px' }, h('div', { style: 'font-size:13px;font-weight:600;margin-bottom:6px' }, f.path)));
    const diff = h('div', { class: 'diff' });
    diff.appendChild(h('div', { class: 'diff-h' }, oldContent === '' ? 'New file' : 'Changed'));
    const lines = lineDiff(oldContent, f.content);
    for (const l of lines.slice(0, 500)) {
      diff.appendChild(h('div', { class: 'diff-line ' + (l.t === 'add' ? 'add' : l.t === 'del' ? 'del' : 'ctx') },
        (l.t === 'add' ? '+ ' : l.t === 'del' ? '- ' : '  ') + l.s));
    }
    if (lines.length > 500) diff.appendChild(h('div', { class: 'diff-line ctx' }, `… ${lines.length - 500} more lines`));
    body.appendChild(diff);
  }
  body.appendChild(h('div', { class: 'row', style: 'margin-top:16px;position:sticky;bottom:0;background:var(--panel);padding:8px 0' },
    h('button', { class: 'btn', onclick: () => { closeSheet(); toast('Rejected'); } }, 'Reject'),
    h('button', { class: 'btn primary', onclick: async () => {
      await snapshot('Before AI change');
      for (const f of result.files) {
        state.contents.set(f.path, f.content);
        await Project.writeFile(state.project.id, f.path, f.content, mimeOf(f.path));
      }
      await Project.touch(state.project.id);
      state.fileMeta = await Project.listMeta(state.project.id);
      renderFileTree();
      if (state.activePath) editor.open(state.activePath, state.contents.get(state.activePath) ?? await getContent(state.activePath), langOf(state.activePath));
      scheduleRefresh(true);
      closeSheet();
      toast('Applied ' + result.files.length + ' file(s)');
    } }, 'Apply')
  ));
}

/* ---------- github ---------- */
function openGitHub() {
  const body = h('div', {});
  body.appendChild(h('div', { class: 'hint' }, 'Uses a personal access token stored only on this device.'));
  body.appendChild(h('div', { class: 'field' },
    h('label', { text: 'Personal Access Token' }),
    h('input', { type: 'password', id: 'gh-token', placeholder: 'ghp_…' })
  ));
  body.appendChild(h('button', {
    class: 'btn', style: 'width:100%',
    onclick: async () => {
      const t = $('#gh-token').value.trim();
      await GH.setToken(t);
      if (!t) return toast('Token cleared');
      try { const user = await GH.whoami(); toast('Connected as ' + user.login); }
      catch (e) { toast('Auth failed: ' + e.message, 4000); }
    }
  }, 'Save & Connect'));
  if (state.project) {
    body.appendChild(h('div', { class: 'dr-sep' }));
    body.appendChild(h('div', { style: 'font-size:12px;color:var(--dim);margin:12px 0 6px' }, 'REPOSITORY'));
    body.appendChild(h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: importRepoFlow }, 'Import Repo'),
      h('button', { class: 'btn', onclick: publishFlow }, 'Publish')
    ));
  }
  openSheet('GitHub', body);
}
async function importRepoFlow() {
  try {
    const repos = await GH.listRepos();
    const body = h('div', {});
    for (const r of repos.slice(0, 60)) {
      body.appendChild(h('div', { class: 'dr-item', onclick: async () => {
        closeSheet();
        toast('Downloading ' + r.full_name + '…');
        try {
          const entries = await GH.importRepo(r.full_name, r.default_branch);
          const proj = await Project.create(r.name, []);
          for (const e of entries) {
            const p = normalizePath(e.path);
            if (!p) continue;
            const content = isTextFile(p) ? new TextDecoder('utf-8').decode(e.data) : new Blob([e.data], { type: mimeOf(p) });
            await Project.writeFile(proj.id, p, content, mimeOf(p));
          }
          const meta = await Project.listMeta(proj.id);
          await Project.updateMeta(proj.id, { entry: findEntryPath(meta) || 'index.html' });
          await refreshProjects();
          await openProject(proj.id);
          toast('Imported ' + entries.length + ' files');
        } catch (err) { toast('Import failed: ' + err.message, 4000); }
      } },
        h('span', { class: 'i' }, '📦'),
        h('div', { style: 'flex:1' },
          h('div', { text: r.full_name }),
          h('div', { class: 'd-file', text: r.default_branch + (r.private ? ' · private' : '') })
        )
      ));
    }
    openSheet('Import Repository', body);
  } catch (e) { toast('Could not list repos: ' + e.message, 4000); }
}
async function publishFlow() {
  const full = prompt('Repository (owner/name):', '');
  if (!full || !full.includes('/')) return;
  const branch = prompt('Branch:', 'main') || 'main';
  const msg = prompt('Commit message:', 'Update from NONONICK Studio') || 'Update from NONONICK Studio';
  closeSheet();
  toast('Publishing…');
  await saveNow();
  const files = await loadAllFiles(state.project.id);
  try {
    const results = await GH.publishProject(full, branch, files, msg);
    toast(`Pushed ${results.length} file(s) to ${full}`);
  } catch (e) { toast('Publish failed: ' + e.message, 5000); }
}

  if (usage) body.appendChild(h('div', { class: 'hint' }, `Used ${fmtSize(usage.usage || 0)} of ${fmtSize(usage.quota || 0)}`));
  body.appendChild(h('button', {
    class: 'btn', style: 'width:100%;color:var(--err)',
    onclick: async () => {
      if (!confirm('Erase ALL data on this device?')) return;

  }, 'Erase All Data'));
  openSheet('Settings', body);

/* ---------- misc ---------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } finally { ta.remove(); }
    return true;
  }
}
function makeTouchIcon() {
  try {
    const c = document.createElement('canvas');
    c.width = 180; c.height = 180;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#07070b'; ctx.fillRect(0, 0, 180, 180);
    const g = ctx.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, '#3b82f6'); g.addColorStop(1, '#8b5cf6');
    ctx.fillStyle = g;
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(20, 20, 140, 140, 32); ctx.fill(); }
    else ctx.fillRect(20, 20, 140, 140);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 74px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('{ }', 90, 94);
    const link = document.createElement('link');
    link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png');
    document.head.appendChild(link);
  } catch {}
}

/* ---------- boot ---------- */
boot().catch(err => {
  console.error('boot failed', err);
  try {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:9999;background:#1a0a0a;border:1px solid #ef4444;color:#fca5a5;padding:12px 14px;border-radius:12px;font:13px/1.4 -apple-system,system-ui,sans-serif';
    banner.innerHTML = '<b>Startup warning</b><br>' + escapeHtml(String(err && err.message || err)) +
      '<br><button onclick="location.reload()" style="margin-top:8px;padding:8px 12px;border-radius:8px;border:0;background:#3b82f6;color:#fff">Retry</button>';
    document.body.appendChild(banner);
  } catch {
    document.body.innerHTML = '<div style="padding:40px;color:#fca5a5;background:#0b0b12"><h2>Startup error</h2><pre>' + escapeHtml(err.stack||err.message) + '</pre><p>Open in Safari, not Files preview.</p></div>';
  }
});
